body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top .wrap{padding-block:0}header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}

.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:3px 9px;font-size:12px}
.empty{color:var(--mute);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px}
.banner{background:var(--jal-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.week .day{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}

.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dot.doing{background:var(--jal)}.dot.ready{background:var(--agni)}.dot.blocked{background:var(--bad)}.dot.done{background:var(--ok)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
td input{width:76px;font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
td input.hit{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)} td input.miss{border-color:var(--warn)}
.stat{display:inline-flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 8px 8px 0}

<style>
.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding-inline:16px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:360px}
.login-card input{width:100%;font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.login-err{color:var(--bad);font-size:14px}
</style>
<script>
(function(){
  const API = "https://awarewolf-tracker.awarewolf.workers.dev";
  let sess = null, name = null, state = null, pickName = null;
  try { sess = localStorage.getItem("aw-sess"); name = localStorage.getItem("aw-name"); } catch (e) {}
  const subs = {};
  let ready; const gate = new Promise(r => ready = r);
  async function call(path, body){
    const r = await fetch(API + path, { method: body ? "POST" : "GET",
      headers: Object.assign({"content-type":"application/json"}, sess ? {authorization: "Bearer " + sess} : {}),
      body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && path !== "/api/login") { logout(); throw {code:"expired"}; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw {code: r.status === 401 ? "wrong" : "unavailable", message: j.error || ""};
    return j;
  }
  function snap(c){ const m = (state && state[c]) || {}; const docs = Object.entries(m).map(([id, d]) => ({id, exists:true, data:() => d})); return {docs, size:docs.length, empty:!docs.length}; }
  function emit(){ for (const c in subs) subs[c].forEach(f => f(snap(c))); }
  async function refresh(){ try { state = await call("/api/state"); emit(); } catch (e) {} }
  async function put(coll, id, data, merge){ await call("/api/put", {coll, id, data, merge: !!merge}); refresh(); }
  function docRef(c, id){ return { set: d => put(c, id, d), update: d => put(c, id, d, true) }; }
  const db = {
    collection(c){ return {
      onSnapshot(cb){ (subs[c] = subs[c] || []).push(cb); if (state) cb(snap(c)); return () => {}; },
      async add(data){ const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await put(c, id, data); return {id}; },
      doc(id){ return docRef(c, id); } }; },
    doc(path){ const [c, id] = path.split("/"); return docRef(c, id); }
  };
  const user = { id: async () => name, isOwner: async () => name === "Ritwik", can: async () => true,
    profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, {id:i, name: i === "claude" ? "Claude" : i}])) };
  function show(){ document.getElementById("login").hidden = false; }
  function logout(){ sess = null; try { localStorage.removeItem("aw-sess"); } catch (e) {} show(); }
  document.addEventListener("click", e => { const b = e.target.closest("[data-login-name]"); if (!b) return;
    pickName = b.dataset.loginName; document.querySelectorAll("[data-login-name]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault(); const err = document.getElementById("login-err"); err.hidden = true;
    if (!pickName) { err.textContent = "Pick your name first."; err.hidden = false; return; }
    try {
      const j = await call("/api/login", {name: pickName, password: document.getElementById("login-pw").value});
      sess = j.session; name = j.name;
      try { localStorage.setItem("aw-sess", sess); localStorage.setItem("aw-name", name); localStorage.setItem("aw-who", name); } catch (e) {}
      document.getElementById("login").hidden = true; await refresh(); ready();
    } catch (x) { err.textContent = x.code === "wrong" ? "That password didn't work. Check it with Ritwik." : "Couldn't reach the tracker. Check your connection and try again."; err.hidden = false; }
  });
  if (sess) { refresh().then(ready); } else { show(); }
  setInterval(() => { if (sess && !document.hidden) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && sess) refresh(); });
  window.claude = { use: async n => { await gate; return n === "db" ? db : n === "user" ? user : null; } };
})();
</script>

const LANES = {BF:"Backfill",PL:"Pipeline",GR:"Growth",TT:"TikTok",ALL:"All lanes"};
const START = "2026-10-12", END = "2027-01-09";
const STATES = [["todo","To Do"],["doing","In Progress"],["ready","Ready For Ritwik"],["blocked","Needs Help"],["done","Done"]];
const OWNERS = ["Diksha","Ritwik","Claude"];
const TAGS = {YT:"YouTube",TT:"TikTok",IG:"Instagram",RD:"Reddit",MAKE:"Make",CHECK:"Check",OS:"OS",COLLAB:"Collab",SETUP:"Setup",PREP:"Prep",DAILY:"Daily",BF:"Backfill",PL:"Pipeline",ALL:"All 3"};
const WEEKS = Array.from({length:13},(_,i)=>addDays(START,i*7));
const METRICS = [
  ["igf","IG followers",[6400,7400,8500]],["igv","IG median views, last 10",[2000,2500,3000]],["igss","IG shares+saves /1k reach",[14,16,18]],
  ["win","Trials that won %",[15,20,25]],["promo","Winners promoted (week)",[2,3,3]],["yts","YT subscribers",[100,350,600]],
  ["ytv","YT median views, last 10",[300,600,1000]],["ttf","TikTok followers",[50,250,500]],["lat","Hours to Ritwik's yes",[24,12,12]]];

let me = load("who","Diksha"), view = load("view","today"), cur = clampDate(isoToday());
let status = {}, notes = [], scores = {}, bf = {}, bfFilter = load("bff","all"), db = null, user = null, myId = null, writable = true, pending = false;
const drafts = {}, openC = new Set();

function load(k,d){try{return localStorage.getItem("aw-"+k)||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem("aw-"+k,v)}catch(e){}}
function isoToday(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function clampDate(iso){return iso<START?START:iso>END?END:iso}
function fmt(iso,opt){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",opt||{weekday:"short",day:"numeric",month:"short"})}
function dayNo(iso){return Math.round((new Date(iso+"T12:00:00")-new Date(START+"T12:00:00"))/864e5)+1}
function st(id){return (status[id]&&status[id].state)||"todo"}
function ownerOf(t){return (status[t.id]&&status[t.id].owner)||t.owner}
function mine(t){return me==="All"||ownerOf(t)===me}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ago(ms){const h=(Date.now()-ms)/36e5;return h<1?Math.max(1,Math.round(h*60))+" min ago":h<48?Math.round(h)+" h ago":Math.round(h/24)+" days ago"}
let names = {};
async function resolveNames(){
  if(!user) return; const ids=[...new Set(notes.map(n=>n.by).concat(Object.values(status).map(s=>s.by)).filter(Boolean))];
  if(!ids.length) return; try{const ps=await user.profiles(ids);let ch=false;for(const id of ids){const nm=ps[id]&&ps[id].name||"";if(names[id]!==nm){names[id]=nm;ch=true}}if(ch)render()}catch(e){}
}
function who(id){return id&&id===myId?"You":(names[id]||"Someone")}

/* ---------- writes ---------- */
async function writeStatus(id, patch){
  if(!db){return}
  const prev = Object.assign({}, status[id]||{});
  const next = Object.assign(prev, patch, {by:myId, at:Date.now()});
  if(patch.state==="ready") next.readyAt = Date.now();
  if(patch.state==="done") next.doneAt = Date.now();
  status[id]=next; render();
  try{ await db.doc("status/"+id).set(next) }catch(e){ fail(e) }
}
async function addNote(id, text, help){
  if(!db||!text.trim()) return;
  try{
    await db.collection("notes").add({taskId:id, text:text.trim().slice(0,2000), help:!!help, resolved:false, by:myId, at:Date.now()});
    drafts[id]="";
    if(help && st(id)!=="done") await writeStatus(id,{state:"blocked"});
  }catch(e){ fail(e) }
}
async function resolveNote(nid){ if(!db) return; try{ await db.doc("notes/"+nid).update({resolved:true, resolvedBy:myId, resolvedAt:Date.now()}) }catch(e){ fail(e) } }
async function saveScore(week, key, val){
  if(!db) return; const prev = Object.assign({}, scores[week]||{});
  if(val===""){delete prev[key]} else prev[key]=Number(val);
  prev.by=myId; prev.at=Date.now(); scores[week]=prev;
  try{ await db.doc("scores/"+week).set(prev) }catch(e){ fail(e) }
}
function fail(e){
  const c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"){writable=false;showConn("You can view this tracker but not change it. Sign in again.")}
  else if(c==="expired"){showConn("Your sign-in expired. Sign in again.");}
  else if(c==="quota_exceeded") showConn("The tracker's storage is full. Ask Ritwik to clear old comments.");
  else showConn("That change didn't save. Check your connection and try again.");
  render();
}
function showConn(msg){const b=document.getElementById("conn");b.textContent=msg;b.hidden=!msg}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&a.tagName==="TEXTAREA"&&a.closest("#view")){pending=true;return}
  pending=false;
  document.querySelectorAll("textarea[data-id]").forEach(t=>drafts[t.dataset.id]=t.value);
  document.querySelectorAll("[data-who]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===me));
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  const inbox = inboxItems();
  document.getElementById("inbox-badge").innerHTML = inbox.count?`<span class="badge">${inbox.count}</span>`:"";
  const v=document.getElementById("view");
  v.innerHTML = view==="today"?renderToday():view==="week"?renderWeek():view==="backfill"?renderBackfill():view==="inbox"?renderInbox(inbox):view==="numbers"?renderNumbers():renderRules();
  document.querySelectorAll("details.c").forEach(d=>{if(openC.has(d.dataset.id))d.open=true});
}
function card(t, showDate){
  const s=st(t.id), o=ownerOf(t), ns=notes.filter(n=>n.taskId===t.id).sort((a,b)=>a.at-b.at);
  const dis = (!db||!writable)?"disabled":"";
  const hint = "";
  const help = ns.filter(n=>n.help&&!n.resolved).length;
  return `<article class="task s-${s}${t.gate?" gate":""}">
   <div class="meta"><span class="tag t-${t.tag}">${TAGS[t.tag]||t.tag}</span>${t.lane&&t.lane!=="ALL"&&TAGS[t.tag]!==LANES[t.lane]?`<span>${LANES[t.lane]}</span>`:""}${showDate?`<span>Day ${t.n} · ${fmt(t.date)}</span>`:""}${t.gate?`<span>Gate / review</span>`:""}
    <label class="own">Owner <select data-own="${t.id}" ${dis}>${OWNERS.map(x=>`<option${x===o?" selected":""}>${x}</option>`).join("")}</select></label></div>
   <p class="txt">${esc(t.text)}</p>${hint}
   <div class="states" role="group" aria-label="Status">${STATES.map(([k,l])=>`<button class="st-${k}" data-st="${k}" data-id="${t.id}" aria-pressed="${s===k}" ${dis}>${l}</button>`).join("")}</div>
   <details class="c" data-id="${t.id}"><summary>Comments${ns.length?` (${ns.length})`:""}${help?` · <span class="flag">needs help</span>`:""}</summary>
    ${ns.map(n=>`<div class="note${n.help?" help":""}${n.resolved?" res":""}"><div class="by"><b>${esc(who(n.by))}</b><span>${ago(n.at)}</span>${n.help?`<span class="flag">${n.resolved?"Help given":"Needs help"}</span>`:""}${n.help&&!n.resolved&&db&&writable?`<button class="btn small" data-res="${n.id}">Mark Resolved</button>`:""}</div>${esc(n.text)}</div>`).join("")}
    ${db&&writable?`<div class="compose"><textarea data-id="${t.id}" aria-label="Comment" placeholder="What's done, what's stuck, what you need…">${esc(drafts[t.id]||"")}</textarea>
     <div class="row"><label><input type="checkbox" id="help-${t.id}"> I need help with this</label><button class="btn primary" data-add="${t.id}">Add Comment</button></div></div>`:""}
   </details></article>`;
}
function renderToday(){
  const day=TASKS.filter(t=>t.date===cur&&mine(t));
  const isToday=cur===clampDate(isoToday());
  const carried=isToday?TASKS.filter(t=>t.date<cur&&mine(t)&&st(t.id)!=="done"):[];
  const done=day.filter(t=>st(t.id)==="done").length;
  let h=`<div class="daynav"><button class="btn" data-day="-1" aria-label="Previous day">←</button>
   <div class="title"><div class="big">${fmt(cur,{weekday:"long",day:"numeric",month:"long"})}</div><div class="sub">Day ${dayNo(cur)} of 90 · ${me==="All"?"everyone":me}${isToday?"":` · <a href="#" data-today>Back to today</a>`}</div></div>
   <button class="btn" data-day="1" aria-label="Next day">→</button></div>
   <div class="summary"><span><b>${done}/${day.length}</b> done</span><span><b>${day.filter(t=>st(t.id)==="ready").length}</b> waiting for Ritwik</span><span><b>${day.filter(t=>st(t.id)==="blocked").length}</b> need help</span></div>`;
  if(carried.length) h+=`<h3>Carried Over (${carried.length})</h3><div class="list">${carried.slice(0,15).map(t=>card(t,true)).join("")}</div>`;
  h+=`<h3>${isToday?"Today":"This Day"}</h3>`;
  h+= day.length?`<div class="list">${day.map(t=>card(t,false)).join("")}</div>`:`<p class="empty">Nothing for ${me} on this day. Switch to Everyone to see the full day.</p>`;
  return h;
}
function renderWeek(){
  const mon=addDays(cur,-((new Date(cur+"T12:00:00").getDay()+6)%7));
  let h=`<div class="daynav"><button class="btn" data-day="-7" aria-label="Previous week">←</button><div class="title"><div class="big">Week Of ${fmt(mon,{day:"numeric",month:"long"})}</div><div class="sub">Tap a day to open it</div></div><button class="btn" data-day="7" aria-label="Next week">→</button></div><div class="week">`;
  for(let i=0;i<7;i++){const d=addDays(mon,i); if(d<START||d>END) continue;
    const ts=TASKS.filter(t=>t.date===d&&mine(t));
    h+=`<div class="day${d===isoToday()?" today":""}" data-open="${d}" role="button" tabindex="0"><div class="d">${fmt(d,{weekday:"short"})}<small>${fmt(d,{day:"numeric",month:"short"})} · D${dayNo(d)}</small></div><div class="mini">${ts.length?ts.map(t=>`<span><i class="dot ${st(t.id)}"></i>${esc(TAGS[t.tag]||t.tag)}: ${esc(t.text)}</span>`).join(""):`<span style="color:var(--mute)">Nothing for ${me}</span>`}</div></div>`}
  return h+"</div>";
}
function inboxItems(){
  const byId=Object.fromEntries(TASKS.map(t=>[t.id,t]));
  const ready=TASKS.filter(t=>st(t.id)==="ready").sort((a,b)=>(status[a.id].readyAt||0)-(status[b.id].readyAt||0));
  const helpIds=new Set(notes.filter(n=>n.help&&!n.resolved).map(n=>n.taskId));
  TASKS.forEach(t=>{if(st(t.id)==="blocked")helpIds.add(t.id)});
  const help=[...helpIds].map(id=>byId[id]).filter(Boolean);
  return {ready, help, count: me==="Diksha"?help.length:ready.length+help.length};
}
function renderInbox(ib){
  const age=t=>{const r=status[t.id]&&(status[t.id].readyAt||status[t.id].at);if(!r)return"";const old=Date.now()-r>864e5;return `<span class="age${old?" old":""}">waiting ${ago(r).replace(" ago","")}</span>`};
  let h=`<h2>Ready For Ritwik</h2><p class="sub" style="color:var(--mute)">Prepared work waiting for a yes. Target: under 12 hours. Approve by marking it Done once it's posted.</p>`;
  h+= ib.ready.length?`<div class="list">${ib.ready.map(t=>card(t,true).replace('<div class="meta">',`<div class="meta">${age(t)}`)).join("")}</div>`:`<p class="empty">Nothing waiting. When Diksha marks a task Ready For Ritwik it shows up here.</p>`;
  h+=`<h2>Needs Help</h2>`;
  h+= ib.help.length?`<div class="list">${ib.help.map(t=>card(t,true).replace('<div class="meta">',`<div class="meta">${age(t)}`)).join("")}</div>`:`<p class="empty">No open questions. Tick “I need help with this” on a comment to raise one.</p>`;
  return h;
}
function latency(){
  const xs=Object.values(status).filter(s=>s.readyAt&&s.doneAt&&s.doneAt>s.readyAt&&Date.now()-s.doneAt<14*864e5).map(s=>(s.doneAt-s.readyAt)/36e5).sort((a,b)=>a-b);
  return xs.length?{med:xs[Math.floor(xs.length/2)],n:xs.length}:null;
}
function renderNumbers(){
  const all=TASKS.length, dn=TASKS.filter(t=>st(t.id)==="done").length, due=TASKS.filter(t=>t.date<isoToday()).length;
  const dueDone=TASKS.filter(t=>t.date<isoToday()&&st(t.id)==="done").length, L=latency();
  let h=`<h2>Program Health</h2>
   <div><span class="stat"><b>${dn}/${all}</b><span>tasks done</span></span>
   <span class="stat"><b>${due?Math.round(dueDone/due*100)+"%":"–"}</b><span>of past-due tasks done</span></span>
   <span class="stat"><b>${L?L.med.toFixed(1)+" h":"–"}</b><span>median wait for Ritwik's yes${L?` (${L.n} items, 14 days)`:""}</span></span></div>
   <h2>Weekly Scorecard</h2><p style="color:var(--mute);font-size:14px">Fill one row every Sunday from Instagram insights, YouTube Studio and TikTok Studio. Green meets the target for that stage (Day 30, 60 or 90), amber is below it. Blank is fine when a number doesn't exist yet.</p>
   <div class="tw"><table><thead><tr><th>Week</th>${METRICS.map(m=>`<th>${m[1]}</th>`).join("")}</tr></thead><tbody>`;
  WEEKS.forEach((w,i)=>{const stage=i<4?0:i<8?1:2, row=scores[w]||{};
    h+=`<tr><td>W${i+1} · ${fmt(w,{day:"numeric",month:"short"})}</td>${METRICS.map(([k,,tg])=>{const v=row[k];const cls=v==null?"":(k==="lat"?v<=tg[stage]:v>=tg[stage])?"hit":"miss";
      return `<td><input type="number" step="any" inputmode="decimal" id="sc-${w}-${k}" data-week="${w}" data-key="${k}" value="${v==null?"":v}" class="${cls}" placeholder="${tg[stage]}" ${(!db||!writable)?"disabled":""} aria-label="${k} week ${i+1}"></td>`}).join("")}</tr>`});
  return h+`</tbody></table></div><p style="color:var(--mute);font-size:14px">Placeholders show the target for that stage. Day 75 goals: 8,500 Instagram followers (from 5,399), 600 YouTube subscribers, 500 TikTok followers if TikTok is live.</p>`;
}
function bfDoc(id){return bf[id]||{}}
function bfDecision(r){return bfDoc(r.id).decision||r.sugg}
async function saveBf(id, patch){
  if(!db) return; const next=Object.assign({}, bfDoc(id), patch, {by:myId, at:Date.now()}); bf[id]=next; render();
  try{ await db.doc("backfill/"+id).set(next) }catch(e){ fail(e) }
}
function renderBackfill(){
  const keep=BACKFILL.filter(r=>bfDecision(r)==="keep"), decided=BACKFILL.filter(r=>bfDoc(r.id).decision).length;
  const on=(r,p)=>["live","already"].includes(bfDoc(r.id)[p]);
  const F={all:"All",keep:"Keep",review:"Needs a decision",noyt:"Missing YouTube",nott:"Missing TikTok",skip:"Skip"};
  const rows=BACKFILL.filter(r=>{const d=bfDecision(r),x=bfDoc(r.id);
    return bfFilter==="all"||(bfFilter==="keep"&&d==="keep")||(bfFilter==="skip"&&d==="skip")||(bfFilter==="review"&&!x.decision)||
      (bfFilter==="noyt"&&d==="keep"&&!on(r,"yt"))||(bfFilter==="nott"&&d==="keep"&&!on(r,"tt"))});
  const dis=(!db||!writable)?"disabled":"";
  const plat=(r,p,label)=>{const x=bfDoc(r.id);return `<span class="plat">${label} <select id="bf-${p}-${r.id}" data-bf="${r.id}" data-f="${p}" ${dis}>${[["","Not started"],["scheduled","Scheduled"],["live","Live"],["already","Already there"],["blocked","Blocked"]].map(([v,l])=>`<option value="${v}"${(x[p]||"")===v?" selected":""}>${l}</option>`).join("")}</select>
     <input type="url" id="bf-${p}url-${r.id}" placeholder="Link" value="${esc(x[p+"Url"]||"")}" data-bf="${r.id}" data-f="${p}Url" ${dis} aria-label="${label} link">${/^https:\/\//.test(x[p+"Url"]||"")?` <a href="${esc(x[p+"Url"])}" target="_blank" rel="noopener">Open</a>`:""}</span>`};
  let h=`<h2>Backfill: Instagram → YouTube + TikTok</h2>
   <p style="color:var(--mute);font-size:14px">Every reel already on Instagram, best-first by views. Decide Keep or Skip, then log each upload here. Suggestions: public reels Keep, trial variants Skip (their winner already covers them), old or off-feed reels Review. Due: YouTube by Day 33, TikTok by Day 60, all checked by Day 75.</p>
   <div class="progress"><span class="stat"><b>${decided}/${BACKFILL.length}</b><span>decided</span></span><span class="stat"><b>${keep.length}</b><span>to backfill</span></span>
   <span class="stat"><b>${keep.filter(r=>on(r,"yt")).length}/${keep.length}</b><span>on YouTube</span></span><span class="stat"><b>${keep.filter(r=>on(r,"tt")).length}/${keep.length}</b><span>on TikTok</span></span></div>
   <div class="filters seg" role="group" aria-label="Filter">${Object.entries(F).map(([k,l])=>`<button data-bff="${k}" aria-pressed="${bfFilter===k}">${l}</button>`).join("")}</div><div class="list">`;
  h+=rows.map(r=>{const x=bfDoc(r.id),d=bfDecision(r);return `<div class="bfrow d-${d}"><div class="top"><b>${esc(r.title)}</b><a href="${esc(r.url)}" target="_blank" rel="noopener">Instagram</a></div>
    <div class="nums">${r.date} · ${r.kind} · ${r.views!=null?r.views.toLocaleString()+" views":"no views data"}${r.reach?" · "+r.reach.toLocaleString()+" reach":""}${r.ss!=null?" · "+r.ss+" shares+saves /1k":""}</div>
    <div class="ctl"><span class="states" role="group" aria-label="Decision">${[["keep","Keep","done"],["skip","Skip","todo"],["review","Review","ready"]].map(([k,l,c])=>`<button class="st-${c}" data-bfd="${k}" data-id="${r.id}" aria-pressed="${d===k}" ${dis}>${l}</button>`).join("")}</span>
     ${x.decision?"":`<span class="sugg">suggested</span>`}
     <label><input type="checkbox" id="bf-music-${r.id}" data-bfc="${r.id}" data-f="music" ${x.music?"checked":""} ${dis}> IG-library music</label>
     <label><input type="checkbox" id="bf-ai-${r.id}" data-bfc="${r.id}" data-f="ai" ${x.ai?"checked":""} ${dis}> AI visuals</label></div>
    ${x.note?`<div class="nums" style="color:var(--bad)">${esc(x.note)}</div>`:""}${d==="keep"?`<div class="ctl">${plat(r,"yt","YouTube")}${plat(r,"tt","TikTok")}</div>`:""}</div>`}).join("");
  return h+(rows.length?"":`<p class="empty">Nothing matches this filter.</p>`)+"</div>";
}
function renderRules(){
  return `<div class="rules">
  <h2>How This Works</h2>
  <p>Open <b>Today</b>, pick your name, and work down your list. Unfinished tasks from earlier days carry over to the top.</p>
  <ul><li><b>To Do</b>: not started. <b>In Progress</b>: you're on it.</li>
  <li><b>Ready For Ritwik</b>: prepared and waiting for his yes. Nothing gets posted, published or sent without it.</li>
  <li><b>Needs Help</b>: you're stuck. Add a comment saying exactly what you need and tick “I need help with this”. It goes to the Inbox.</li>
  <li><b>Done</b>: finished, or posted after his yes.</li></ul>
  <h2>The Goal: Done By Day 75 (Fri 25 Dec)</h2>
  <ol><li><b>Backfill:</b> every reel marked Keep is public on YouTube and on TikTok, with links in the Backfill tab.</li>
  <li><b>Pipeline:</b> a winning trial reel goes to Instagram, YouTube and TikTok with one approval in the Trial Reel Poster. 10 promotions in a row with no manual fixes.</li>
  <li><b>Growth:</b> the Day 75 targets in Numbers are met, or the gap has a written reason.</li></ol>
  <p>TikTok goes out as prepared posts: the pipeline gets the video and caption ready, a person publishes it in the TikTok app and pastes the link back. Still outside our control: whether YouTube locks API uploads to Private, and TikTok needing a posting route outside India.</p>
  <h2>Who Owns What</h2>
  <ul><li><b>Ritwik</b>: filming, posting trial reels, posting winners on Instagram, decisions, account setup, approvals, comment replies, collabs. Nothing new is posted without his yes. Approving the Keep list is his yes for the backfill.</li>
  <li><b>Diksha</b>: watching trial reels and flagging winners to Ritwik, then posting each winner on YouTube and TikTok once he has posted it on Instagram; backfill uploads and links; Story drafts; comment harvest; weekly scorecard.</li>
  <li><b>Claude</b>: building and fixing the pipeline, upload packages, token checks. Ritwik starts these by asking Claude.</li></ul>
  <h2>Pre-Publish Checklist</h2>
  <ol><li>Hook in frame 1: 5 to 8 words, Title Case, inside the safe zone (not the bottom 20% or right edge).</li>
  <li>Captions on. The handle aware._wolf_ stays lowercase.</li>
  <li>Title is the hook, under 60 characters, with one keyword. 1 to 3 hashtags.</li>
  <li>YouTube: related video set and the reel added to its series playlist.</li>
  <li>Use the file from the upload package, never a screen recording or a download with another app’s watermark.</li>
  <li>Any study named on screen. “May help”, never “cures”.</li>
  <li>AI visuals labelled on every platform.</li>
  <li>TikTok: privacy set to Everyone, keyword in the first line of the caption, 3 to 5 specific hashtags.</li>
  <li>CTA spoken after the payoff.</li>
  <li>Scheduled in the right slot: 8:00 PM ET or 10:00 AM ET.</li></ol>
  <h2>House Rules</h2>
  <ul><li>Backfill goes best-first: the strongest reels open each new channel.</li><li>Reels with Instagram-library music get the music swapped (YouTube Audio Library or original audio) before upload, or they risk claims and muting.</li>
  <li>Anything in Needs Help or Ready For Ritwik for more than 24 hours turns red in the Inbox.</li>
  <li>Monday filming is protected. Don't book anything over it.</li>
  <li>Judge in batches of 7 to 10 posts. Don't delete videos that underperform.</li>
  <li>Comments here are for work. No passwords or account logins in comments.</li></ul></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-open],[data-today]"); if(!b) return;
  if(b.dataset.who){me=b.dataset.who;save("who",me);render();return}
  if(b.dataset.view){view=b.dataset.view;save("view",view);render();return}
  if(b.dataset.day){cur=clampDate(addDays(cur,+b.dataset.day));render();return}
  if(b.hasAttribute("data-today")){e.preventDefault();cur=clampDate(isoToday());render();return}
  if(b.dataset.open){cur=b.dataset.open;view="today";save("view",view);render();window.scrollTo(0,0);return}
  if(b.dataset.bff){bfFilter=b.dataset.bff;save("bff",bfFilter);render();return}
  if(b.dataset.bfd){saveBf(b.dataset.id,{decision:b.dataset.bfd});return}
  if(b.dataset.st){writeStatus(b.dataset.id,{state:b.dataset.st});return}
  if(b.dataset.add){const id=b.dataset.add, ta=document.querySelector(`textarea[data-id="${id}"]`), cb=document.getElementById("help-"+id);
    openC.add(id); addNote(id, ta.value, cb&&cb.checked); ta.value=""; ta.blur(); return}
  if(b.dataset.res){resolveNote(b.dataset.res);return}
});
document.addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest("[data-open]");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();d.click()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.own){writeStatus(t.dataset.own,{owner:t.value});return}
  if(t.dataset.bfc){saveBf(t.dataset.bfc,{[t.dataset.f]:t.checked});return}
  if(t.dataset.bf){saveBf(t.dataset.bf,{[t.dataset.f]:t.value.trim()});return}
  if(t.dataset.week){saveScore(t.dataset.week,t.dataset.key,t.value);return}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.c")){d.open?openC.add(d.dataset.id):openC.delete(d.dataset.id)}},true);
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.id&&e.target.tagName==="TEXTAREA")drafts[e.target.dataset.id]=e.target.value});
document.addEventListener("focusout",e=>{if(e.target.tagName==="TEXTAREA")setTimeout(()=>{if(pending)render()},150)});

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!window.claude.use){showConn("Saving is off in this preview. Open the published tracker to mark tasks and comment.");db=null;render();return}
  [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
  if(!db){showConn("Sign in to claude.ai to mark tasks and comment. You can still read the plan.");render();return}
  if(user){
    myId = await user.id();
    const own = await user.isOwner();
    if(load("who","")===""){me=own?"Ritwik":"Diksha";save("who",me)}
    const cw = await user.can("data.write");
    if(cw===false){writable=false;showConn("You can view this tracker but not change it. Sign in again.")}
  }
  db.collection("status").onSnapshot(s=>{status={};s.docs.forEach(d=>status[d.id]=d.data());render();resolveNames()},()=>showConn("Live updates stopped. Reload the page."));
  db.collection("notes").onSnapshot(s=>{notes=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();resolveNames()},()=>showConn("Live updates stopped. Reload the page."));
  db.collection("backfill").onSnapshot(s=>{bf={};s.docs.forEach(d=>bf[d.id]=d.data());render()},()=>{});
  db.collection("scores").onSnapshot(s=>{scores={};s.docs.forEach(d=>scores[d.id]=d.data());render()},()=>{});
  render();
})();
</script>
